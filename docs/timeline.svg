<svg xmlns="http://www.w3.org/2000/svg" width="892" height="549" viewBox="0 0 892 549" role="img" aria-label="Output of release_timeline.py: Steam deadlines worked out backwards from a release date, split into must-do and best-to-do dates">
<rect width="892" height="549" rx="10" fill="#0f1720"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">
<tspan x="24" y="61" fill="#7dd3fc">$ python3 release_timeline.py --release 2027-09-14 --nextfest 2027-06-14</tspan>
<tspan x="24" y="82" fill="#94a3b8"></tspan>
<tspan x="24" y="103" fill="#fde68a" font-weight="700">Release: Tue 14 Sep 2027   |   Next Fest Mon 14 Jun 2027 to Mon 21 Jun 2027</tspan>
<tspan x="24" y="124" fill="#94a3b8"></tspan>
<tspan x="24" y="145" fill="#f87171" font-weight="700">MUST DO BY</tspan>
<tspan x="24" y="166" fill="#94a3b8">Steam rules. Miss one and you lose Next Fest or must move the release.</tspan>
<tspan x="24" y="187" fill="#94a3b8"></tspan>
<tspan x="24" y="208" fill="#f87171">  Thu 13 May 2027</tspan><tspan fill="#e2e8f0">   Pay the USD 100 app fee</tspan><tspan fill="#94a3b8">  (needed before the store page, 21-day wait before release)</tspan>
<tspan x="24" y="229" fill="#f87171">  Thu 13 May 2027</tspan><tspan fill="#e2e8f0">   Send store page to Valve for review</tspan><tspan fill="#94a3b8">  (Next Fest needs a live store page)</tspan>
<tspan x="24" y="250" fill="#f87171">  Mon 24 May 2027</tspan><tspan fill="#e2e8f0">   Coming Soon page is live</tspan><tspan fill="#94a3b8">  (Next Fest needs a live store page)</tspan>
<tspan x="24" y="271" fill="#f87171">  Mon 24 May 2027</tspan><tspan fill="#e2e8f0">   Send demo for review</tspan><tspan fill="#94a3b8">  (Next Fest rule: 3 weeks before)</tspan>
<tspan x="24" y="292" fill="#f87171">  Fri 03 Sep 2027</tspan><tspan fill="#e2e8f0">   Send final build and launch discount for review</tspan><tspan fill="#94a3b8">  (review takes up to 7 business days)</tspan>
<tspan x="24" y="313" fill="#94a3b8"></tspan>
<tspan x="24" y="334" fill="#4ade80" font-weight="700">BEST TO DO BY</tspan>
<tspan x="24" y="355" fill="#94a3b8">Recommended, so enough people wishlist the game.</tspan>
<tspan x="24" y="376" fill="#94a3b8"></tspan>
<tspan x="24" y="397" fill="#4ade80">  Tue 16 Feb 2027</tspan><tspan fill="#e2e8f0">   Open Steamworks account, do the tax interview</tspan><tspan fill="#94a3b8">  (tax check takes up to 15 business days)</tspan>
<tspan x="24" y="418" fill="#4ade80">  Tue 09 Mar 2027</tspan><tspan fill="#e2e8f0">   Send store page to Valve for review</tspan>
<tspan x="24" y="439" fill="#4ade80">  Thu 18 Mar 2027</tspan><tspan fill="#e2e8f0">   Coming Soon page is live</tspan><tspan fill="#94a3b8">  (6 months to collect wishlists)</tspan>
<tspan x="24" y="460" fill="#4ade80">  Thu 15 Apr 2027</tspan><tspan fill="#e2e8f0">   Demo is live</tspan><tspan fill="#94a3b8">  (time for feedback before Next Fest)</tspan>
<tspan x="24" y="481" fill="#4ade80">  Mon 10 May 2027</tspan><tspan fill="#e2e8f0">   Send demo for review</tspan><tspan fill="#94a3b8">  (to be in the Next Fest press preview)</tspan>
<tspan x="24" y="502" fill="#94a3b8"></tspan>
<tspan x="24" y="523" fill="#94a3b8">Values from the Steamworks docs. Re-check them before you commit to a date.</tspan>
</text>
</svg>